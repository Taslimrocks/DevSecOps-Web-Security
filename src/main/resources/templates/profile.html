<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/">Home</a>
    <form action="/logout" method="post">
        <button class="btn btn-danger">Logout</button>
    </form>
</nav>

<div class="container mt-4">

    <div class="card p-4 shadow">
        <h3>User Profile</h3>

        <img th:src="${user.profileImagePath != null} ? ${user.profileImagePath} : '/uploads/default.png'" width="120" class="mb-3"/>

        <p><b>Name:</b> <span th:text="${user.name}"></span></p>
        <p><b>Gender:</b> <span th:text="${user.gender}"></span></p>

        <hr>

        <h4>Edit Profile</h4>

        <form action="/update-profile" method="post" enctype="multipart/form-data">
            <input class="form-control mb-2" type="text" name="name" th:value="${user.name}" />

            <select class="form-control mb-2" name="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <input class="form-control mb-2" type="file" name="image" />

            <button class="btn btn-primary">Update</button>
        </form>
    </div>

</div>

</body>
</html>
