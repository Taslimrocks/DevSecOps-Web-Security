<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile - SecurLogin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
<link rel="preload" href="/style.css" as="style">
<link rel="stylesheet" th:href="@{/style.css}">
</head>

<body class="profile-bg">

<!-- 🔐 NAVBAR -->
<nav class="navbar custom-navbar px-4">

    <!-- LOGO -->
    <div class="logo">
        🔐 <span>SecurLogin</span>
    </div>

    <!-- NAV LINKS -->
    <div class="nav-links">
        <a href="/" class="nav-link active">Home</a>
        <a href="/login" class="nav-link">Login</a>
        <a href="/register" class="btn neon-btn">Get Started</a>
    </div>

</nav>

<!-- 🔥 MAIN -->
<div class="container mt-5">

    <h2 class="text-center text-info mb-5">Account Profile & Security</h2>

    <div class="row">

        <!-- LEFT SIDE -->
        <div class="col-md-6 mb-4">

            <div class="glass-card p-4 text-center">

                <h5 class="text-info mb-3">User Identity</h5>

                <!-- IMAGE -->
                <img 
                th:src="${user != null && user.profileImagePath != null ? user.profileImagePath : '\images\default.jpg'}"
                class="rounded-circle border border-info mb-3 profile-img"
                width="120" height="120"
                />

                <h4 th:text="${user.name}">Name</h4>
                <p class="text-light" th:text="${user.username}">@username</p>

                <hr>

                <!-- FORM -->
                <form th:action="@{/update-profile}" method="post" enctype="multipart/form-data">

                    <input type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}" />

                    <input type="text" name="name" class="form-control input-dark mb-2"
                           placeholder="Full Name" th:value="${user.name}">

                    <input type="text" name="gender" class="form-control input-dark mb-2"
                           placeholder="Gender" th:value="${user.gender}">

                    <input type="file" name="image" class="form-control input-dark mb-2"
                           onchange="previewImage(event)">

                    <img id="preview"
                        class="profile-img mt-2"
                        style="display:none; width:100px; border-radius:10px;" />

                    <button class="btn neon-btn w-100 mt-3">Update Profile</button>

                </form>

            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="col-md-6">

            <!-- SECURITY -->
            <div class="glass-card p-4 mb-4">
                <h5 class="text-info">Security Posture</h5>

                <p>Security Level: TEST</p>

                <div class="progress mb-3">
                    <div class="progress-bar bg-info"
                        th:style="'width:' + ${securityScore} + '%;'">
                    </div>
                </div>

                <button class="btn neon-btn w-100">Manage Security</button>
            </div>

            <!-- SESSIONS -->
            <div class="glass-card p-4">
                <div class="session-box neon-card p-3">

                    <h5 class="text-info mb-3">Active Session</h5>

                    <p><b>Device:</b> <span th:text="${device}"></span></p>

                    <p>Status:
                        <span class="badge bg-success">Active Now</span>
                    </p>

                </div>
            </div>

        </div>

    </div>

</div>

<script>
function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function () {
        document.getElementById("preview").src = reader.result;
    };
    reader.readAsDataURL(event.target.files[0]);
}
</script>

</body>
</html>
