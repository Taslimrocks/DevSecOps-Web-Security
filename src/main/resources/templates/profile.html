<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">DevSecApp</a>
</nav>

<div class="container mt-5">

    <div class="card p-4 shadow text-center col-md-6 mx-auto">

        <h3>My Profile</h3>

        <img th:src="${user.profileImagePath}" class="profile-img mb-3">

        <h5 th:text="${user.name}"></h5>
        <p th:text="${user.username}"></p>
        <p th:text="${user.gender}"></p>

        <form method="post" action="/update-profile" enctype="multipart/form-data">

            <input name="name" class="form-control mb-2" placeholder="Name">
            <input name="gender" class="form-control mb-2" placeholder="Gender">
            <input type="file" name="image" class="form-control mb-2">

            <button class="btn btn-primary w-100">Update Profile</button>
        </form>

    </div>

</div>

</body>
</html>
