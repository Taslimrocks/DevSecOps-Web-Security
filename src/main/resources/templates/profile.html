<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<!-- SIMPLE NAVBAR (keep it simple for now) -->
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">DevSecApp</a>
    <a href="/logout" class="btn btn-danger">Logout</a>
</nav>

<!-- PROFILE CARD -->
<div class="container d-flex justify-content-center mt-5">

    <div class="card p-4 shadow text-center" style="width: 400px;">

        <!-- PROFILE IMAGE -->
        <img 
            th:src="${user.profileImagePath != null ? user.profileImagePath : '/uploads/default.png'}"
            class="rounded-circle mb-3"
            width="120" height="120"
        >

        <!-- NAME -->
        <h3 th:text="${user.name}">Name</h3>
        <p class="text-muted" th:text="${user.username}">@username</p>

        <hr>

        <!-- UPDATE FORM -->
        <form action="/update-profile" method="post" enctype="multipart/form-data">

            <input type="text" name="name" class="form-control mb-2" placeholder="Name" th:value="${user.name}">

            <input type="text" name="gender" class="form-control mb-2" placeholder="Gender" th:value="${user.gender}">

            <input type="file" name="image" class="form-control mb-2" onchange="previewImage(event)">

            <!-- IMAGE PREVIEW -->
            <img id="preview" style="display:none; width:100px; margin-top:10px; border-radius:10px;"/>

            <button class="btn btn-primary mt-3">Update Profile</button>

        </form>

    </div>

</div>

<!-- IMAGE PREVIEW SCRIPT -->
<script>
function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function(){
        const output = document.getElementById('preview');
        output.src = reader.result;
        output.style.display = 'block';
    }
    reader.readAsDataURL(event.target.files[0]);
}
</script>

</body>
</html>
