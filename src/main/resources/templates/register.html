<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<!-- 🔥 NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4 shadow">
    <a class="navbar-brand fw-bold" href="/">DevSecApp</a>

    <div>
        <a href="/login" class="btn btn-outline-light">Login</a>
    </div>
</nav>

<!-- 🔥 REGISTER FORM -->
<div class="container d-flex justify-content-center align-items-center" style="min-height:90vh;">

    <div class="card login-card p-4 shadow-lg">

        <h3 class="text-center mb-3 fw-bold">Create Account 🚀</h3>

        <!-- ERROR MESSAGE -->
        <div th:if="${param.error}" class="alert alert-danger text-center">
            ❌ Username already exists
        </div>

        <form th:action="@{/register}" method="post">

            <!-- Username -->
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
            </div>

            <!-- Gender -->
            <div class="mb-3">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-control" required>
                    <option value="">Select gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <!-- Password -->
            <div class="mb-3 position-relative">
                <label class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>

                <i class="bi bi-eye-slash toggle-password" onclick="togglePassword('password', this)"></i>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3 position-relative">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" required>

                <i class="bi bi-eye-slash toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
            </div>

            <!-- Button -->
            <button class="btn btn-success w-100 login-btn">Register</button>

        </form>

        <p class="text-center mt-3">
            Already have an account? <a href="/login">Login</a>
        </p>

    </div>

</div>

<!-- 🔥 JS -->
<script>
function togglePassword(fieldId, icon) {
    const field = document.getElementById(fieldId);

    if (field.type === "password") {
        field.type = "text";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
    } else {
        field.type = "password";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    }
}

// ✅ Password match validation
document.querySelector("form").addEventListener("submit", function(e) {
    const pass = document.getElementById("password").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (pass !== confirm) {
        e.preventDefault();
        alert("❌ Passwords do not match!");
    }
});
</script>

</body>
</html>
