<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">
</head>

<body class="bg-light">

<!-- 🔥 NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4 shadow">
    <a class="navbar-brand fw-bold" href="/">DevSecApp</a>

    <div>
        <a href="/" class="btn btn-outline-light me-2">Home</a>
        <a href="/register" class="btn btn-success">Register</a>
    </div>
</nav>

<!-- 🔥 MAIN LOGIN -->
<div class="container d-flex justify-content-center align-items-center" style="min-height:90vh;">

    <div class="card login-card p-4 shadow-lg">

        <h3 class="text-center mb-3 fw-bold">Welcome Back 👋</h3>

        <!-- ERROR -->
        <div th:if="${param.error}" class="alert alert-danger text-center">
            ❌ Invalid username or password
        </div>

        <!-- LOGOUT -->
        <div th:if="${param.logout}" class="alert alert-success text-center">
            ✅ Logged out successfully
        </div>

        <form th:action="@{/login}" method="post">

            <!-- Username -->
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <!-- Password with toggle -->
            <div class="mb-3 position-relative">
                <label class="form-label">Password</label>

                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>

                <!-- 👁 Toggle Icon -->
                <i class="bi bi-eye-slash toggle-password" onclick="togglePassword()"></i>
            </div>

            <!-- Remember Me -->
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="remember-me" id="remember">
                <label class="form-check-label" for="remember">
                    Remember me
                </label>
            </div>

            <!-- Button -->
            <button class="btn btn-primary w-100 login-btn">Login</button>

        </form>

        <p class="text-center mt-3">
            New user? <a href="/register">Create account</a>
        </p>

    </div>

</div>

<!-- JS -->
<script>
function togglePassword() {
    const password = document.getElementById("password");
    const icon = document.querySelector(".toggle-password");

    if (password.type === "password") {
        password.type = "text";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
    } else {
        password.type = "password";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    }
}
</script>

</body>
</html>
