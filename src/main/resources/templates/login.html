<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SecurLogin - Secure Access</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
<link rel="preload" href="/style.css" as="style">
<link rel="stylesheet" th:href="@{/style.css}">
</head>

<body class="login-bg">

<nav class="navbar custom-navbar px-4">

    <!-- LOGO -->
    <div class="logo">
        🔐 <span>SecurLogin</span>
    </div>

    <!-- NAV LINKS -->
    <div class="nav-links">
        <a href="/" class="nav-link active">Home</a>
        <a href="/login" class="nav-link active">Login</a>
        <a href="/register" class="btn neon-btn">Get Started</a>
    </div>

</nav>

<!-- 🔥 MAIN -->
<div class="container d-flex justify-content-center align-items-center" style="min-height:90vh;">

    <div class="glass-card p-5 w-100" style="max-width:900px;">


        <!-- ✅ ADD HERE -->
        <h2 class="text-center mb-3">
            Secure Access Portal
        </h2>

        <p class="text-center text-light mb-3">
            Authenticate securely to access your cyber dashboard
        </p>

        <div class="text-center mb-4">
            <span class="badge bg-dark text-info px-3 py-2">
                🔐 Zero-Trust Authentication Enabled
            </span>
        </div>

    <!-- 🔽 EXISTING CONTENT CONTINUES -->
    <div class="row align-items-center">

        <div class="row align-items-center">

            <!-- LEFT SIDE -->
            <div class="col-md-6">

                <form th:action="@{/login}" method="post">

                    <div class="mb-3">
                        <input type="text" id="username" name="username"
                               class="form-control input-dark"
                               placeholder="Access Cipher / Username" required>
                    </div>

                    <div class="mb-3 position-relative">
                           <input type="password" id="password" name="password"
                               class="form-control input-dark"
                               placeholder="Password" required>
    
                        
       
                    </div>

                    <button class="btn neon-btn w-100 mb-3">
                        Login with Credentials
                    </button>

                    <div class="text-center">
                        <a href="#" class="text-info small">Forgot Cipher?</a>
                    </div>

                </form>

            </div>

            <!-- RIGHT SIDE -->
            <div class="col-md-6 text-center">

                <div class="fingerprint mb-3">
                    <i class="bi bi-fingerprint"></i>
                </div>

                <p class="text-light">Scan to Authenticate</p>

                <button class="btn neon-btn mt-3">
                    LOGIN WITH FINGERPRINT
                </button>

            </div>

        </div>

    </div>

</div>

<!-- FOOTER -->
<div class="footer-text">
    🔐 SecurLogin - Accessing
</div>

</body>
</html>
