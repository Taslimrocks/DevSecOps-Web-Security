<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SecurLogin - Secure Access</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
<link rel="stylesheet" href="/style.css?v=2">
</head>

<body class="login-bg">

<!-- 🔐 NAVBAR -->
<nav class="navbar px-4 py-3">
    <a class="navbar-brand fw-bold text-light" href="#">
        🔐 <span style="color:#c084fc;">SecurLogin</span>
    </a>

    <div>
        <a href="/" class="text-light me-3">Home</a>
        <a href="/login" class="text-info">Login</a>
    </div>
</nav>

<!-- 🔥 MAIN -->
<div class="container d-flex justify-content-center align-items-center" style="min-height:90vh;">

    <div class="glass-card p-5 w-100" style="max-width:900px;">

        <h2 class="text-center mb-5" style="color:#c084fc;">
            Secure Access Portal
        </h2>

        <div class="row align-items-center">

            <!-- LEFT SIDE -->
            <div class="col-md-6">

                <form th:action="@{/login}" method="post">

                    <div class="mb-3">
                        <input type="text" id="username" name="username"
                               class="form-control input-dark"
                               placeholder="Access Cipher / Username" required>
                    </div>

                    <div class="mb-3 position-relative">
                           <input type="password" id="password" name="password"
                               class="form-control input-dark"
                               placeholder="Password" required>
    
                        
       
                    </div>

                    <button class="btn neon-btn w-100 mb-3">
                        Login with Credentials
                    </button>

                    <div class="text-center">
                        <a href="#" class="text-info small">Forgot Cipher?</a>
                    </div>

                </form>

            </div>

            <!-- RIGHT SIDE -->
            <div class="col-md-6 text-center">

                <div class="fingerprint mb-3">
                    <i class="bi bi-fingerprint"></i>
                </div>

                <p class="text-light">Scan to Authenticate</p>

                <button class="btn neon-btn mt-3">
                    LOGIN WITH FINGERPRINT
                </button>

            </div>

        </div>

    </div>

</div>

<!-- FOOTER -->
<div class="footer-text">
    🔐 SecurLogin - Accessing
</div>

</body>
</html>
